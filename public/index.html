<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>급식메이트 PRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <div id="header-nav" class="header-nav">
        <button class="home-btn" id="btn-home">🏠 홈으로</button>
        <div id="current-school-display" style="font-size: 14px; font-weight: bold; color: var(--accent);"></div>
    </div>

    <div id="search-area" class="search-section">
        <h1 class="main-title">오늘 뭐 나올까? <span style="color:var(--accent); font-size:18px;">PRO</span></h1>
        <div class="search-box">
            <input type="text" id="school-input" placeholder="학교 이름을 입력하세요">
            <button class="search-btn" id="btn-search">검색</button>
        </div>
        
        <div id="favorites-section" class="favorites-container" style="display: none;">
            <div class="favorites-title">즐겨찾는 학교</div>
            <div id="fav-list" class="fav-list"></div>
        </div>

        <ul id="school-list"></ul>
    </div>

    <div id="meal-section">
        <div class="date-container">
            <label style="font-size: 13px; color: var(--text-sub); margin-left: 5px; margin-bottom: 5px; display: block;">날짜 선택</label>
            <input type="date" id="meal-date">
        </div>
        <div id="meal-container"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
